<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  p { font-size: 20px; margin: 20px; border: 1px solid #ccc; padding: 10px; }
  .a { /* پیش‌فرض */ }
  .b { unicode-bidi: isolate; display: inline-block; }
</style>
</head>
<body>
  <p class="a">نام: علی رضایی</p>
  <p class="a">کد ملی: 1234567890</p>
  <p class="a">تاریخ: 1405/05/12</p>
  <p class="a">۱. تبصره اول</p>

  <hr>

  <p class="b"><b>نام:</b> علی رضایی</p>
  <p class="b"><b>کد ملی:</b> 1234567890</p>
  <p class="b"><b>تاریخ:</b> 1405/05/12</p>
  <p class="b"><b>۱.</b> تبصره اول</p>
</body>
</html>
