<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سامانه تنظیم قرارداد</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  * { box-sizing: border-box; font-family: 'Vazirmatn', 'Tahoma', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh; margin: 0; padding: 30px 15px;
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  }
  .container {
    max-width: 820px; margin: auto;
    background: #fff; border-radius: 16px;
    padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  h1 { text-align: center; color: #444; margin-bottom: 25px; font-size: 22px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; margin-bottom: 6px; color: #555; font-weight: bold; font-size: 14px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; transition: .2s;
    font-family: 'Vazirmatn', 'Tahoma', sans-serif; background: #fafafa;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: #667eea; outline: none; background: #fff;
    box-shadow: 0 0 0 3px rgba(102,126,234,.2);
  }
  .row { display: flex; gap: 15px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 200px; }
  .section-title {
    color: #667eea; margin: 25px 0 15px; font-size: 16px;
    border-bottom: 2px solid #eef; padding-bottom: 8px;
  }
  .hint { font-size: 12px; color: #888; margin-top: 5px; }
  .checkbox-field {
    display: flex; align-items: center; gap: 8px;
    background: #f7f8ff; padding: 12px 15px;
    border-radius: 8px; border: 1px solid #e0e4ff;
    margin-bottom: 15px; cursor: pointer;
  }
  .checkbox-field input { width: auto; }
  .checkbox-field label { margin: 0; cursor: pointer; font-weight: normal; color: #555; }
  button {
    background: #667eea; color: #fff; border: none;
    padding: 14px 25px; border-radius: 8px;
    cursor: pointer; font-size: 16px; width: 100%;
    margin-top: 20px; transition: .2s; font-weight: bold;
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  }
  button:hover { background: #5568d3; transform: translateY(-1px); }
  button:disabled { background: #aab; cursor: wait; }

  /* ============ پیش‌نمایش PDF ============ */
  #preview {
    background: #fff; padding: 45px; color: #222;
    font-size: 14px; line-height: 2;
    direction: rtl;
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  }

  #preview * { unicode-bidi: isolate; }

  #preview .header {
    text-align: center;
    border-bottom: 3px double #667eea;
    padding-bottom: 15px;
    margin-bottom: 25px;
    position: relative;
    direction: rtl;
  }
  #preview .header h2 { margin: 0; color: #333; font-size: 22px; }
  #preview .header .sub { color: #667eea; font-size: 13px; margin-top: 8px; }

  /* تاریخ - گوشه بالا راست */
  #preview .date-box {
    position: absolute; top: 0; right: 0;
    font-size: 13px; color: #555;
    direction: rtl;
    text-align: right;
    line-height: 1.8;
    unicode-bidi: isolate;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #preview .date-box .label {
    font-weight: normal;
    direction: rtl;
    unicode-bidi: isolate;
  }
  #preview .date-box .val {
    display: inline-block;
    direction: ltr;
    unicode-bidi: isolate;
  }
  #preview .date-box .line {
    display: inline-block;
    border-bottom: 1px dotted #999;
    min-width: 40px;
    height: 14px;
    margin: 0 3px;
    vertical-align: middle;
  }

  #preview h3 {
    color: #667eea;
    font-size: 16px;
    margin: 22px 0 10px;
    border-right: 4px solid #667eea;
    padding-right: 10px;
    text-align: right;
    direction: rtl;
  }

  /* ============ طرفین - با flex ============ */
  #preview .parties {
    display: flex;
    gap: 20px;
    margin: 15px 0;
    direction: rtl;
  }
  #preview .parties > div {
    flex: 1;
    background: #f7f8ff;
    border-radius: 8px;
    padding: 12px 15px;
    border: 1px solid #e0e4ff;
    direction: rtl;
  }
  #preview .parties h4 {
    margin: 0 0 10px;
    color: #667eea;
    font-size: 14px;
    text-align: center;
  }
  /* ردیف‌های اطلاعات */
  #preview .parties .row-item {
    display: flex;
    flex-direction: row;
    gap: 8px;
    margin: 6px 0;
    font-size: 13px;
    direction: rtl;
    align-items: flex-start;
  }
  #preview .parties .row-item .lbl {
    flex-shrink: 0;
    font-weight: bold;
    color: #333;
    min-width: 55px;
    text-align: right;
    direction: rtl;
    unicode-bidi: isolate;
  }
  #preview .parties .row-item .val {
    flex: 1;
    text-align: right;
    direction: rtl;
    unicode-bidi: isolate;
    word-break: break-word;
  }
  #preview .parties .row-item .val.ltr {
    direction: ltr;
    text-align: right;
    unicode-bidi: isolate;
  }

  #preview .content {
    text-align: justify;
    margin-top: 10px;
    direction: rtl;
  }

  /* ============ تبصره‌ها ============ */
  #preview .notes-list {
    padding: 0;
    margin: 10px 0;
    list-style: none;
    direction: rtl;
  }
  #preview .notes-list li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13.5px;
    direction: rtl;
    text-align: right;
  }
  #preview .notes-list li .num {
    flex-shrink: 0;
    min-width: 24px;
    font-weight: bold;
    color: #667eea;
    direction: ltr;
    unicode-bidi: isolate;
    display: inline-block;
    text-align: left;
  }
  #preview .notes-list li .text {
    flex: 1;
    text-align: right;
    direction: rtl;
  }

  /* ============ جدول اطلاعات ============ */
  #preview .info-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    direction: rtl;
  }
  #preview .info-table td {
    border: 1px solid #e0e4ff;
    padding: 10px 14px;
    font-size: 13px;
    text-align: right;
    direction: rtl;
    vertical-align: top;
  }
  #preview .info-table td:first-child {
    background: #f7f8ff;
    font-weight: bold;
    width: 30%;
    color: #333;
    text-align: right;
  }
  #preview .info-table td:last-child .val {
    display: inline-block;
    direction: rtl;
    unicode-bidi: isolate;
  }
  #preview .info-table td:last-child .val.ltr {
    direction: ltr;
    unicode-bidi: isolate;
  }

  .signatures {
    display: flex;
    justify-content: space-between;
    margin-top: 70px;
    padding-top: 15px;
    direction: rtl;
  }
  .signatures > div {
    text-align: center;
    width: 45%;
    border-top: 1px solid #999;
    padding-top: 10px;
    font-size: 13px;
    color: #555;
  }
  .empty {
    display: inline-block;
    border-bottom: 1px dotted #999;
    min-width: 100px;
    height: 14px;
  }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 999; color: #fff; font-size: 18px;
  }
  .loading-overlay.show { display: flex; }
</style>
</head>
<body>

<div class="container">
  <h1>📄 سامانه تنظیم قرارداد</h1>

  <div class="field">
    <label>نوع قرارداد</label>
    <select id="contractType">
      <option value="">-- نوع قرارداد را انتخاب کنید --</option>
      <option value="rent">قرارداد اجاره</option>
      <option value="sale">قرارداد خرید و فروش</option>
      <option value="work">قرارداد همکاری</option>
    </select>
    <div class="hint">با انتخاب نوع قرارداد، متن‌های ثابت هر نوع به‌طور خودکار در PDF قرار می‌گیرند.</div>
  </div>

  <div class="section-title">👤 اطلاعات طرفین</div>

  <div class="row">
    <div class="field">
      <label>نام طرف اول</label>
      <input id="p1name" placeholder="مثلاً: علی رضایی">
    </div>
    <div class="field">
      <label>کد ملی طرف اول</label>
      <input id="p1code" dir="ltr" style="text-align:right;" placeholder="0012345678">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>تلفن طرف اول</label>
      <input id="p1phone" dir="ltr" style="text-align:right;" placeholder="0912xxxxxxx">
    </div>
    <div class="field">
      <label>آدرس طرف اول</label>
      <input id="p1address" placeholder="مثلاً: تهران، خیابان ...">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>نام طرف دوم</label>
      <input id="p2name" placeholder="مثلاً: مریم احمدی">
    </div>
    <div class="field">
      <label>کد ملی طرف دوم</label>
      <input id="p2code" dir="ltr" style="text-align:right;" placeholder="0087654321">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>تلفن طرف دوم</label>
      <input id="p2phone" dir="ltr" style="text-align:right;" placeholder="0912xxxxxxx">
    </div>
    <div class="field">
      <label>آدرس طرف دوم</label>
      <input id="p2address" placeholder="مثلاً: تهران، خیابان ...">
    </div>
  </div>

  <div class="section-title">📋 اطلاعات قرارداد</div>
  <div class="row">
    <div class="field">
      <label>موضوع قرارداد</label>
      <input id="subject" placeholder="مثلاً: آپارتمان مسکونی">
    </div>
    <div class="field">
      <label>مبلغ (تومان)</label>
      <input id="amount" dir="ltr" style="text-align:right;" placeholder="500,000,000">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>مدت / زمان</label>
      <input id="duration" placeholder="مثلاً: ۱۲ ماه">
    </div>
  </div>

  <div class="section-title">📅 تاریخ</div>

  <div class="checkbox-field">
    <input type="checkbox" id="handwriteDate" checked>
    <label for="handwriteDate">
      تاریخ به‌صورت دست‌نویس در PDF خالی بماند
    </label>
  </div>

  <div class="field">
    <label>تاریخ</label>
    <input id="date" dir="ltr" style="text-align:right;" placeholder="مثلاً: 1405/05/05">
    <div class="hint">
      اگر تیک دست‌نویس برداشته شود، این تاریخ عیناً در PDF درج می‌شود.
    </div>
  </div>

  <div class="field" style="margin-top:15px;">
    <label>توضیحات و شرایط اختصاصی</label>
    <textarea id="customNotes" rows="4" placeholder="هر شرط یا تبصره خاصی که مد نظر دارید اینجا بنویسید..."></textarea>
  </div>

  <button id="pdfBtn" onclick="generatePDF()">📥 دانلود PDF قرارداد</button>
</div>

<div class="loading-overlay" id="loading">
  <div>⏳ در حال آماده‌سازی PDF...</div>
</div>

<div id="preview" style="display:none;"></div>

<script>
const templates = {

    obligations: [

      'طرف دوم متعهد است از مورد اجاره صرفاً در جهت توافق‌شده استفاده نماید.',
      'پرداخت اجاره‌بها در ابتدای هر ماه و بدون تأخیر بر عهده طرف دوم است.',
      'هزینه‌های آب، برق، گاز و شارژ بر عهده طرف دوم می‌باشد.'
    ],
    termination: [
      'در صورت عدم پرداخت اجاره‌بها تا یک ماه، طرف اول حق فسخ قرارداد را دارد.',
      'تخلیه مورد اجاره در پایان مدت الزامی است.',
      'تحویل مورد اجاره در پایان قرارداد باید در همان وضعیت اولیه باشد.'
    ],
    generalNotes: [
      'این قرارداد در دو نسخه با اعتبار یکسان تنظیم شده است.',
      'هرگونه تغییر یا اصلاح قرارداد باید کتبی و به امضای طرفین برسد.',
      'مرجع حل اختلاف، دادگاه‌های صالح شهر محل انعقاد قرارداد است.',
      'قانون حاکم بر این قرارداد، قوانین جمهوری اسلامی ایران می‌باشد.'
    ]
  },
  sale: {
    title: 'قرارداد خرید و فروش',
    subtitle: 'تنظیم‌شده بر اساس قانون مدنی جمهوری اسلامی ایران',
    preamble: 'نظر به اینکه طرف اول مالک رسمی موضوع معامله بوده و قصد فروش آن را دارد و طرف دوم متقاضی خرید می‌باشد، بدین‌وسیله طرفین با اهلیت کامل قانونی، قرارداد ذیل را منعقد می‌نمایند.',
    obligations: [
      'طرف اول متعهد است موضوع معامله را به‌طور سالم و بدون عیب به طرف دوم تحویل دهد.',
      'طرف دوم متعهد است مبلغ معامله را طبق توافق پرداخت نماید.',
      'انتقال سند رسمی در تاریخ توافق‌شده بر عهده طرف اول است.',
      'هزینه‌های انتقال سند بر عهده طرف دوم می‌باشد.'
    ],
    termination: [
      'در صورت کشف عیب پنهان، طرف دوم حق فسخ معامله را دارد.',
      'در صورت عدم پرداخت مبلغ، فروشنده حق فسخ دارد.',
      'هرگونه خیار شرط باید در متن قرارداد ذکر شود.'
    ],
    generalNotes: [
      'این قرارداد در دو نسخه با اعتبار یکسان تنظیم شده است.',
      'هرگونه تغییر یا اصلاح قرارداد باید کتبی و به امضای طرفین برسد.',
      'مرجع حل اختلاف، دادگاه‌های صالح شهر محل انعقاد قرارداد است.',
      'قانون حاکم بر این قرارداد، قوانین جمهوری اسلامی ایران می‌باشد.'

  },
  work: {
    title: 'قرارداد همکاری',
    subtitle: 'تنظیم‌شده بر اساس قانون کار و قوانین تجاری',
    preamble: 'نظر به اینکه طرف اول به‌عنوان کارفرما و طرف دوم به‌عنوان همکار/پیمانکار قصد انجام موضوع قرارداد را دارند، بدین‌وسیله طرفین با اهلیت کامل قانونی، قرارداد ذیل را منعقد می‌نمایند.',
    obligations: [

      'طرف اول متعهد است حق‌الزحمه توافق‌شده را در موعد مقرر پرداخت کند.',

    ],
    termination: [
      'هر یک از طرفین با اعلام کتبی یک ماه قبل می‌تواند قرارداد را فسخ کند.',
      'در صورت نقض تعهدات، طرف مقابل حق فسخ فوری دارد.',
      'پس از فسخ، تسویه‌حساب تا یک ماه انجام می‌شود.'
    ],
    generalNotes: [
      'این قرارداد در دو نسخه با اعتبار یکسان تنظیم شده است.',
      'هرگونه تغییر یا اصلاح قرارداد باید کتبی و به امضای طرفین برسد.',
      'مرجع حل اختلاف، دادگاه‌های صالح شهر محل انعقاد قرارداد است.',
      'قانون حاکم بر این قرارداد، قوانین جمهوری اسلامی ایران می‌باشد.'
    ]
  }
};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ساخت ردیف اطلاعات طرفین */
function infoRow(label, value, isLtr = false) {
  const v = value && value.trim()
    ? `<span class="val${isLtr ? ' ltr' : ''}">${esc(value.trim())}</span>`
    : '<span class="empty"></span>';
  return `<div class="row-item"><span class="lbl">${esc(label)}</span>${v}</div>`;
}

/* ساخت آیتم‌های لیست تبصره‌ها */
function listItems(arr) {
  return arr.map((item, i) =>
    `<li><span class="num">${i + 1}.</span><span class="text">${esc(item)}</span></li>`
  ).join('');
}

async function generatePDF() {
  const typeKey = document.getElementById('contractType').value;
  if (!typeKey) {
    alert('لطفاً ابتدا نوع قرارداد را انتخاب کنید.');
    return;
  }

  const btn = document.getElementById('pdfBtn');
  const loading = document.getElementById('loading');
  btn.disabled = true;
  loading.classList.add('show');

  try {
    const tpl = templates[typeKey];

    /* اطلاعات طرفین */
    const p1name    = document.getElementById('p1name').value;
    const p1code    = document.getElementById('p1code').value;
    const p1phone   = document.getElementById('p1phone').value;
    const p1address = document.getElementById('p1address').value;
    const p2name    = document.getElementById('p2name').value;
    const p2code    = document.getElementById('p2code').value;
    const p2phone   = document.getElementById('p2phone').value;
    const p2address = document.getElementById('p2address').value;

    /* اطلاعات قرارداد */
    const subject  = document.getElementById('subject').value;
    const amount   = document.getElementById('amount').value;
    const duration = document.getElementById('duration').value;

    const customNotes = document.getElementById('customNotes').value.trim();

    /* --- تاریخ --- */
    const handwrite = document.getElementById('handwriteDate').checked;
    const dateValue = document.getElementById('date').value.trim();

    let dateHtml;
    if (handwrite || !dateValue) {
      dateHtml = `
        <div class="date-box">
          <span class="label">تاریخ:</span>
          <span class="line"></span> /
          <span class="line"></span> /
          <span class="line"></span>
        </div>`;
    } else {
      dateHtml = `<div class="date-box"><span class="label">تاریخ:</span> <span class="val">${esc(dateValue)}</span></div>`;
    }

    /* ساخت ستون طرفین با تابع infoRow */
    const p1Column = `
      <div>
        <h4>طرف اول</h4>
        ${infoRow('نام:', p1name)}
        ${infoRow('کد ملی:', p1code, true)}
        ${infoRow('تلفن:', p1phone, true)}
        ${infoRow('آدرس:', p1address)}
      </div>`;

    const p2Column = `
      <div>
        <h4>طرف دوم</h4>
        ${infoRow('نام:', p2name)}
        ${infoRow('کد ملی:', p2code, true)}
        ${infoRow('تلفن:', p2phone, true)}
        ${infoRow('آدرس:', p2address)}
      </div>`;

    /* سلول جدول اطلاعات قرارداد */
    const cellValue = (v, isLtr = false) => {
      if (!v || !v.trim()) return '<span class="empty"></span>';
      return `<span class="val${isLtr ? ' ltr' : ''}">${esc(v.trim())}</span>`;
    };

    const preview = document.getElementById('preview');
    preview.innerHTML = `
      <div class="header">
        ${dateHtml}
        <h2>${esc(tpl.title)}</h2>
        <div class="sub">${esc(tpl.subtitle)}</div>
      </div>

      <h3>مقدمه</h3>
      <p class="content">${esc(tpl.preamble)}</p>

      <h3>مشخصات طرفین</h3>
      <div class="parties">
        ${p1Column}
        ${p2Column}
      </div>

      <h3>موضوع و مشخصات قرارداد</h3>
      <table class="info-table">
        <tr><td>موضوع قرارداد</td><td>${cellValue(subject)}</td></tr>
        <tr><td>مبلغ</td><td>${cellValue(amount, true)} تومان</td></tr>
        <tr><td>مدت / زمان</td><td>${cellValue(duration)}</td></tr>
      </table>

      <h3>تعهدات طرفین</h3>
      <ul class="notes-list">${listItems(tpl.obligations)}</ul>

      <h3>شرایط فسخ و خاتمه</h3>
      <ul class="notes-list">${listItems(tpl.termination)}</ul>

      ${customNotes ? `
        <h3>شرایط اختصاصی</h3>
        <p class="content">${esc(customNotes).replace(/\n/g,'<br>')}</p>
      ` : ''}

      <h3>تبصره‌های عمومی</h3>
      <ul class="notes-list">${listItems(tpl.generalNotes)}</ul>

      <div class="signatures">
        <div>امضای طرف اول<br><br>${esc(p1name) || '<span class="empty"></span>'}</div>
        <div>امضای طرف دوم<br><br>${esc(p2name) || '<span class="empty"></span>'}</div>
      </div>
    `;
    preview.style.display = 'block';

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    await new Promise(r => setTimeout(r, 300));

    const opt = {
      margin: [15, 12, 15, 12],
      filename: `contract-${typeKey}-${Date.now()}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff'
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    await html2pdf().set(opt).from(preview).save();

    preview.style.display = 'none';
  } catch (err) {
    console.error(err);
    alert('خطا در ساخت PDF. لطفاً دوباره تلاش کنید.');
  } finally {
    btn.disabled = false;
    loading.classList.remove('show');
  }
}
</script>

</body>
</html>
